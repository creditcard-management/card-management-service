spring:
  application:
    name: card-currency

  datasource:
    url: jdbc:postgresql://localhost:5432/card_management_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: CurrencyHikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

card:
  currency:
    history-max-size: 100     # Máximo de cotizaciones por consulta de historial
    rates:
      max-age: PT24H                          # Una cotización vigente hace más que esto se alerta como desactualizada
      freshness-check-interval-ms: 300000     # Cada cuánto se recalcula (ExchangeRateFreshnessMonitor)
      freshness-check-initial-delay-ms: 15000

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.unisono.card: DEBUG
